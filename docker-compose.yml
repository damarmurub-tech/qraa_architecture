version: '3.8'

services:
  core_ai_app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - REDIS_URL=redis://redis_server:6379
      - PORT=8080
      - API_KEY=CORE_AI_SECRET_KEY_2026
      - RUST_LOG=info
    depends_on:
      - redis_server

  redis_server:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: always